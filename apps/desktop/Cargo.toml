[package]
name = "capture-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
arboard = "3.7"
capture-core.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "clipboard"] }
egui = { version = "0.37", default-features = false, features = ["experimental"] }
rfd = "0.15"
image.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_Storage_Xps", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Globalization", "Storage_Streams", "Win32_System_WinRT", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_System_Ole", "Win32_System_Variant"] }
