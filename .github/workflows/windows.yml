name: Windows checks and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '2'
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Audit public source and release tooling
        shell: pwsh
        run: |
          node scripts/source-audit.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test scripts/source-audit.test.mjs scripts/release-metadata.test.mjs sites/capture-workbench/scripts/release.test.mjs sites/capture-workbench/scripts/roadmap.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/verify-windows-resource.ps1
      - name: Check branch or pull request
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: ./scripts/check.ps1
      - name: Exercise installer on an ephemeral runner
        if: "!startsWith(github.ref, 'refs/tags/')"
        shell: pwsh
        run: |
          # Installer behavior does not depend on optimization; the immutable tag
          # separately tests the actual optimized release payload.
          cargo build --workspace --locked --offline
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $package = 'artifacts/installer-package'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item target/debug/capture-desktop.exe "$package/ClipCraft.exe"
          Copy-Item target/debug/capture-cli.exe,README.md,LICENSE,NOTICE -Destination $package
          $installer = 'artifacts/clipcraft-ci-setup.exe'
          ./scripts/build-installer.ps1 -Package $package -Output $installer -Version '0.2.0-ci.1'
          ./scripts/test-installer.ps1 -Package $package -Installer $installer -Version '0.2.0-ci.1'
      - name: Package immutable tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+-[a-z0-9.]+)$') { throw 'Unsupported release tag' }
          "RELEASE_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
          ./scripts/package-github.ps1 -Version $Matches[1]
      - name: Preserve check results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-checks
          path: |
            artifacts/checks.json
            artifacts/fmt.log
            artifacts/test.log
            artifacts/clippy.log
            artifacts/installer-test/result.json
          if-no-files-found: warn
      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-release
          path: artifacts/github/releases/${{ env.RELEASE_VERSION }}/public/
          if-no-files-found: error
  dependencies:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, dependencies]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portable-release
          path: release
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/**/*.zip
            release/**/*-setup.exe
      - name: Attest dependency inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/**/*.zip
            release/**/*-setup.exe
          sbom-path: release/sbom.spdx.json
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --prerelease --title "ClipCraft $RELEASE_TAG" --notes-file release/release-notes.md
