name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '2'
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: cargo fetch --locked
      - name: Source and packaging checks
        shell: pwsh
        run: |
          node scripts/source-audit.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test scripts/source-audit.test.mjs scripts/release-metadata.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/verify-windows-resource.ps1
          ./scripts/test-project-files.ps1
      - run: ./scripts/check.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-checks
          path: |
            artifacts/checks.json
            artifacts/fmt.log
            artifacts/test.log
            artifacts/clippy.log
          if-no-files-found: warn
  dependencies:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
