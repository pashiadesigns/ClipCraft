name: Dependency advisory scan
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '21 9 * * 1'
permissions:
  contents: read
jobs:
  rustsec:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned advisory checker
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Check complete lockfile against RustSec
        run: |
          mkdir -p artifacts
          cargo audit --json > artifacts/dependency-audit.json
      - name: Preserve advisory results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-advisories
          path: artifacts/dependency-audit.json
          if-no-files-found: warn
