[workspace]
members = ["crates/core", "apps/cli", "apps/desktop"]
resolver = "2"

[workspace.package]
version = "1.0.0-beta.3"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
capture-core = { path = "crates/core" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
thiserror = "2"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
