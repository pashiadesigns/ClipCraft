[package]
name = "capture-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
image.workspace = true
thiserror.workspace = true
gif = "0.14"
color_quant = "2.0"
base64 = "0.23"
flate2 = "1"
ttf-parser = "0.25"
imageproc = { version = "0.27", default-features = false }
tempfile = "3"
ab_glyph = "0.2.32"
epaint_default_fonts = { version = "0.37", default-features = false }
harfrust = "0.15"
unicode-segmentation = "1.13"
vello_cpu = { version = "0.3.0", default-features = false, features = ["std", "u8_pipeline"] }
resvg = "0.49.0"
# PDF import (engine chosen in artifacts/pdf-engine-spike); 0.9 is pinned once it is two weeks old.
hayro = "=0.9.0"
hayro-svg = "=0.9.0"

[dev-dependencies]
# Already in the tree through resvg; the Office tests check every part is well-formed XML.
roxmltree = "0.21"
